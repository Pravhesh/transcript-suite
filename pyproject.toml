[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcript-suite"
version = "0.1.0"
description = "High-performance transcript suite powered by NVIDIA Canary-Qwen-2.5B with speaker diarization and nature-themed Web UI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "typer[all]>=0.12.0",
    "rich>=13.8.0",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "onnxruntime>=1.19.0",
]

[project.optional-dependencies]
diarization = [
    "pyannote.audio>=3.3.0",
]

[project.scripts]
transcript-suite = "transcript_suite.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["transcript_suite"]
