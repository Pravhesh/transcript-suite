    .mode-pill-btn {
      background: #1e2230; border: 1px solid rgba(255,255,255,0.1); color: #a1a6b4; padding: 4px 10px;

    .mode-pill-btn.active { background: #10b981; color: #000; font-weight: 700; }

      flex-direction: column;
      overflow: hidden;

      background: var(--bg);
      color: var(--text-color);
      font-family: var(--font-main);

    /* SUB-BANNER */
    .theme-banner-strip {

      display: flex;
      align-items: center;
      justify-content: space-between;

      flex-shrink: 0;

      background: var(--surface-bg);
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    .theme-meta-left { display: flex; align-items: center; gap: 12px; }
    .theme-num-badge {
      font-family: monospace; font-size: 10px; font-weight: 800; padding: 2px 7px;
      border-radius: 999px; background: var(--accent); color: #000;
    }
    .theme-name-txt { font-weight: 800; font-size: 14px; letter-spacing: 0.02em; }
    .theme-cat-tag { font-size: 11px; opacity: 0.75; font-weight: 600; }
    .theme-desc-txt { font-size: 11.5px; opacity: 0.85; font-style: italic; max-width: 520px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* STAGE CONTAINER */
    .stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      padding: 14px;
    }

    /* COMMON PANEL CARDS */
    .card-panel { min-height: 0; min-height: 0;
      background: var(--surface-bg);
      border: var(--border-spec);
      border-radius: var(--radius-val);
      box-shadow: var(--shadow-val);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .card-hdr {
      height: 34px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: var(--border-spec);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .card-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* TRANSCRIPT FORMAT */
    .spk-item {
      padding: 8px 10px;
      border-radius: calc(var(--radius-val) * 0.6);
      background: rgba(0,0,0,0.12);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .spk-hdr-line { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 700; color: var(--accent); }
    .spk-txt { font-size: 12.5px; line-height: 1.5; }
    .dispute-chip {
      display: inline-block; background: var(--accent); color: #000; font-weight: 800; font-size: 10.5px;
      padding: 1px 5px; border-radius: 3px; margin: 0 2px;
    }

    /* CONTINUOUS vs TACTILE */
    .mode-continuous .spk-item {
      background: transparent !important;
      border: none !important;
      padding: 5px 0 !important;
      border-bottom: 1px solid rgba(255,255,255,0.06) !important;
    }
    .mode-tactile .spk-item {
      box-shadow: 0 2px 6px rgba(0,0,0,0.25) !important;
    }

    /* ARCHETYPE LAYOUTS */
    .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1;
      display: grid;
      gap: 14px;
      height: 100%;
    }
    
    /* 1. VISUAL NOVEL */
    .layout-visual-novel .stage-grid, .layout-visual_novel .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 240px 1fr 240px; }
    .vn-dialogue-box {
      background: var(--surface-bg);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .vn-nameplate {
      display: inline-block;
      align-self: flex-start;
      background: var(--accent);
      color: #000;
      font-weight: 900;
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    /* 2. ANALOG CONSOLE */
    .layout-analog-console .stage-grid, .layout-analog_console .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 260px 1fr 260px; }
    .vu-dial-meter {
      width: 100%;
      height: 75px;
      background: #1a1813;
      border: 2px solid #5a4b32;
      border-radius: 4px;
      padding: 6px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 10px #000;
    }
    .vu-needle {
      position: absolute; bottom: 0; left: 50%; width: 2px; height: 60px; background: #ff3333;
      transform-origin: bottom center; transform: rotate(-25deg); animation: needleBounce 1.8s infinite ease-in-out;
    }
    @keyframes needleBounce {
      0% { transform: rotate(-35deg); }
      30% { transform: rotate(15deg); }
      50% { transform: rotate(-10deg); }
      70% { transform: rotate(25deg); }
      100% { transform: rotate(-35deg); }
    }

    /* 3. CYBER HUD */
    .layout-cyber-hud .stage-grid, .layout-cyber_hud .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 240px 1fr 280px; }
    .radar-sweep-box {
      width: 110px; height: 110px; border-radius: 50%; border: 1px solid var(--accent);
      position: relative; margin: 8px auto; overflow: hidden;
      background: radial-gradient(circle, rgba(0,255,150,0.05) 0%, transparent 70%);
    }
    .radar-sweep-arm {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: conic-gradient(from 0deg, transparent 0deg, var(--accent) 45deg, transparent 50deg);
      opacity: 0.35; animation: radarRotate 3s linear infinite;
    }
    @keyframes radarRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* 4. GOTHIC VELVET */
    .layout-gothic-velvet .stage-grid, .layout-gothic_velvet .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 250px 1fr 250px; }
    .gothic-arch-card {
      border-radius: 36px 36px var(--radius-val) var(--radius-val);
      border: 1px solid var(--accent);
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    /* 5. BURTONESQUE */
    .layout-burtonesque .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 240px 1fr 240px; }
    .burton-skew { transform: rotate(-1deg); border: 2px dashed var(--accent); }

    /* 6. AERO LIQUID */
    .layout-aero-liquid .stage-grid, .layout-aero_liquid .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 240px 1fr 260px; }
    .aero-orb {
      width: 44px; height: 44px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(0,200,255,0.4) 60%, rgba(0,50,150,0.8));
      box-shadow: 0 4px 15px rgba(0,180,255,0.5), inset 0 0 10px rgba(255,255,255,0.6);
    }

    /* 7. STEAMPUNK */
    .layout-steampunk-machinery .stage-grid, .layout-steampunk_machinery .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 260px 1fr 240px; }

    /* 8. SYNTHWAVE */
    .layout-synthwave-outrun .stage-grid, .layout-synthwave_outrun .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 240px 1fr 260px; }
    .synth-sun-hero {
      height: 95px; background: linear-gradient(180deg, #ff007f 0%, #ffaa00 100%);
      border-radius: 50px 50px 0 0; position: relative; overflow: hidden; margin-bottom: 6px;
    }
    .synth-sun-bars {
      position: absolute; bottom: 0; left: 0; right: 0; height: 100%;
      background: repeating-linear-gradient(0deg, #0d0614, #0d0614 3px, transparent 3px, transparent 10px);
    }

    /* 9. GEOCITIES */
    .layout-geocities-web1 .stage-grid, .layout-geocities_web1 .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 200px 1fr 220px; }
    .web1-table {
      border: 2px outset #ffffff; background: #c0c0c0; color: #000000; padding: 6px; font-family: 'Times New Roman', serif;
    }

    /* 10. SCHOLASTIC */
    .layout-scholastic-grimoire .stage-grid, .layout-scholastic_grimoire .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 240px 1fr 240px; }

    /* 11. SOLARPUNK */
    .layout-solarpunk-botanical .stage-grid, .layout-solarpunk_botanical .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 240px 1fr 260px; }

    /* 12. ARCADE */
    .layout-arcade-cabinet .stage-grid, .layout-arcade_cabinet .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 220px 1fr 240px; }

    /* 13. TACTILE HARDWARE */
    .layout-tactile-hardware .stage-grid, .layout-tactile_hardware .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 240px 1fr 260px; }

    /* 14. POMO GRAPHIC */
    .layout-pomo-graphic .stage-grid, .layout-pomo_graphic .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 240px 1fr 260px; }

    /* 15. AMBIENT LOUNGE */
    .layout-ambient-lounge .stage-grid, .layout-ambient_lounge .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 260px 1fr 240px; }

      width: 70px; height: 70px; border-radius: 50%;
      background: radial-gradient(circle, #ff5500 20%, #111 21%, #222 50%, #111 51%, #1e1e1e 95%, #111 100%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); animation: spinRecord 4s linear infinite;

    @keyframes spinRecord { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* 16. COSMIC ETHEREAL */
    .layout-cosmic-ethereal .stage-grid, .layout-cosmic_ethereal .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 240px 1fr 260px; }

    .layout-y2k-cyber .stage-grid, .layout-y2k_cyber .stage-grid { min-height: 0; flex: 1; min-height: 0; flex: 1; grid-template-columns: 240px 1fr 260px; }

    /* BOTTOM AUDIO DECK */
    .theme-bottom-deck {
      height: 66px;
      background: var(--surface-bg);
      border-top: var(--border-spec);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;

    .deck-play-btn {
      width: 38px; height: 38px; border-radius: 999px; background: var(--accent); color: #000;

    .w-bar { width: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; transition: height 0.1s ease; }
    .w-bar.active { background: var(--accent); }
  </style>
</head>

function renderAudioDeck(theme) {
      const acc = theme.accent || "#00ffcc";
      let waveBarsHtml = "";
      for (let i = 0; i < 48; i++) {
        const h = Math.floor(Math.random() * 20) + 6;
        waveBarsHtml += `<div class="w-bar ${i < 18 ? 'active' : ''}" style="height:${h}px;"></div>`;
      }

      return `
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="deck-play-btn" onclick="togglePlay()">▶</button>
          <div>
            <div style="font-family:monospace; font-size:11.5px; font-weight:700;">00:04.280 / 14:20.000</div>
            <div style="font-size:9.5px; opacity:0.7;">48 kHz 24-bit PCM • Real-time Sync</div>
          </div>
        </div>

        <div class="wave-bars-holder" id="waveBarsContainer">
          ${waveBarsHtml}
        </div>

        <div style="font-family:monospace; font-size:10.5px; font-weight:700; color:var(--accent);">
          [ PEAK: -6.2 dBFS ]
        </div>
      `;
    }

    // --- APPLY THEME ---
    function selectTheme(key) {
      const t = THEMES[key];
      if (!t) return;
      currentThemeKey = key;

      const root = document.documentElement;
      root.style.setProperty("--bg", t.bg || "#08090c");
      root.style.setProperty("--surface-bg", t.surface || "rgba(20,20,30,0.6)");
      root.style.setProperty("--border-spec", t.border || "1px solid rgba(255,255,255,0.1)");
      root.style.setProperty("--radius-val", t.radius || "8px");
      root.style.setProperty("--font-main", t.font || "'Inter', sans-serif");
      root.style.setProperty("--text-color", t.text_color || "#ededed");
      root.style.setProperty("--accent", t.accent || "#00ffcc");
      root.style.setProperty("--shadow-val", t.glow || "0 4px 15px rgba(0,0,0,0.3)");

      // Viewport class
      const vp = document.getElementById("aestheticViewport");
      const archRaw = t.archetype || 'pomo_graphic';
      const archHyphen = archRaw.replace(/_/g, '-');
      vp.className = `aesthetic-viewport layout-${archRaw} layout-${archHyphen}`;

      // Update banner
      document.getElementById("themeNumBadge").innerText = `#${String(t.index).padStart(2, '0')}`;
      document.getElementById("themeNameTxt").innerText = t.name;
      document.getElementById("themeCatTag").innerText = `[ ${t.category} • ${t.archetype} ]`;
      document.getElementById("themeDescTxt").innerText = t.desc;

      // Update Dropdown
      const sel = document.getElementById("themeSelect");
      if (sel.value !== key) sel.value = key;

      // Render Stage & Deck
      document.getElementById("stageContainer").innerHTML = renderStage(t);
      document.getElementById("audioDeck").innerHTML = renderAudioDeck(t);

      // URL Sync
      const url = new URL(window.location);
      url.searchParams.set("theme", key);
      window.history.replaceState({}, "", url);
    }

    // --- DROPDOWN POPULATOR ---
    function populateDropdown() {
      const sel = document.getElementById("themeSelect");
      sel.innerHTML = "";
      Object.keys(THEMES).sort((a,b) => THEMES[a].index - THEMES[b].index).forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.text = `#${String(THEMES[k].index).padStart(2, '0')} - ${THEMES[k].name} (${THEMES[k].category})`;
        sel.appendChild(opt);
      });
    }

    function filterThemes(q) {
      q = q.toLowerCase();
      const sel = document.getElementById("themeSelect");
      Array.from(sel.options).forEach(opt => {
        const txt = opt.text.toLowerCase();
        opt.style.display = txt.includes(q) ? "" : "none";
      });
    }

    function navPrev() {
      const keys = Object.keys(THEMES).sort((a,b) => THEMES[a].index - THEMES[b].index);
      let idx = keys.indexOf(currentThemeKey);
      idx = (idx - 1 + keys.length) % keys.length;
      selectTheme(keys[idx]);
    }

    function navNext() {
      const keys = Object.keys(THEMES).sort((a,b) => THEMES[a].index - THEMES[b].index);
      let idx = keys.indexOf(currentThemeKey);
      idx = (idx + 1) % keys.length;
      selectTheme(keys[idx]);
    }

    function randomTheme() {
      const keys = Object.keys(THEMES);
      const r = keys[Math.floor(Math.random() * keys.length)];
      selectTheme(r);
    }

    function setMode(m) {
      document.body.className = `mode-${m}`;
      document.getElementById("btnContinuous").classList.toggle("active", m === "continuous");
      document.getElementById("btnTactile").classList.toggle("active", m === "tactile");
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playInterval = setInterval(() => {
          const bars = document.querySelectorAll(".w-bar");
          bars.forEach(b => {
            b.style.height = (Math.floor(Math.random() * 22) + 4) + "px";
          });
        }, 120);
      } else {
        clearInterval(playInterval);
      }
    }

    // --- INIT ---
    window.addEventListener("DOMContentLoaded", () => {
      populateDropdown();
      const params = new URLSearchParams(window.location.search);
      const themeParam = params.get("theme");
      if (themeParam && THEMES[themeParam]) {
        selectTheme(themeParam);
      } else {
        selectTheme("y3k_futurism");
      }
    });
  </script>
